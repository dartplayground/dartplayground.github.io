<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dart শেখার খাতা</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: খাতার মতো — বামে সূচি (সপ্তাহ → টপিক), ডানে পড়ার পাতা; মোবাইলে সূচি উপরে ভাঁজ করা */
:root {
  --bg: #EDF2F6; --surface: #FFFFFF; --surface2: #F4F7FA; --ink: #10222F; --muted: #55697A; --line: #D2DDE6;
  --accent: #0466AE; --accent-ink: #FFFFFF; --accent-soft: #DCECF9;
  --teal: #0B857C; --teal-soft: #D6F0EC;
  --ok: #1B7A4B; --ok-soft: #DBF2E4; --warn: #915C00; --warn-soft: #FBEDCF; --bad: #B3302D; --bad-soft: #FADFDD;
  --code-bg: #0E1C28; --code-ink: #DCE7F0; --code-muted: #7890A4; --code-line: #1E3242; --code-hl: #17344B;
  --hl-kw: #6CC4FF; --hl-str: #A3E39A; --hl-num: #FFB86B; --hl-com: #6E8598; --hl-fn: #FFD479; --hl-type: #62E0D0;
  --f-display: 'Baloo Da 2', 'Hind Siliguri', system-ui, sans-serif;
  --f-body: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A141C; --surface: #111F2A; --surface2: #0D1922; --ink: #E2EBF2; --muted: #92A6B7; --line: #213443;
  --accent: #4DB2F4; --accent-ink: #04121C; --accent-soft: #10304A;
  --teal: #3FC8BA; --teal-soft: #0E3431;
  --ok: #5CCB8D; --ok-soft: #0F2F1E; --warn: #F0B24A; --warn-soft: #33260C; --bad: #F2817C; --bad-soft: #3A1716;
  --code-bg: #060F16; --code-line: #172836; --code-hl: #163049;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A141C; --surface: #111F2A; --surface2: #0D1922; --ink: #E2EBF2; --muted: #92A6B7; --line: #213443;
  --accent: #4DB2F4; --accent-ink: #04121C; --accent-soft: #10304A;
  --teal: #3FC8BA; --teal-soft: #0E3431;
  --ok: #5CCB8D; --ok-soft: #0F2F1E; --warn: #F0B24A; --warn-soft: #33260C; --bad: #F2817C; --bad-soft: #3A1716;
  --code-bg: #060F16; --code-line: #172836; --code-hl: #163049;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.7; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.25; text-wrap: balance; margin: 0; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--surface2); border: 1px solid var(--line); padding: .05em .35em; border-radius: 5px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; align-items: center; gap: 14px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .dart { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: .95rem; }
.bar .meter { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); }
.meter .track { flex: 1; height: 8px; background: var(--surface2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; max-width: 320px; }
.meter .fill { height: 100%; background: var(--teal); width: 0; transition: width .4s; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 4px 12px; }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
nav.side { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 56px); overflow-y: auto;
  padding: 18px 12px 40px max(16px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); font-size: .95rem; }
.side a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink); padding: 5px 10px; border-radius: 8px; line-height: 1.4; }
.side a:hover { background: var(--surface2); }
.side a.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.side .wk { margin-top: 14px; padding: 0 10px 4px; font-size: .78rem; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.side .cnt { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.side .cnt.full { color: var(--ok); font-weight: 700; }

main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }
.page { max-width: 820px; margin: 0 auto; display: grid; gap: 34px; }
.page > section { display: grid; gap: 16px; }
.page p { margin: 0; }
.page h2 { font-size: 1.7rem; display: flex; align-items: baseline; gap: 10px; }
.page h2 .step { font-size: .8rem; font-family: var(--f-body); font-weight: 600; color: var(--teal); letter-spacing: .05em; }
.page h3 { font-size: 1.25rem; margin-top: 8px; }
.eyebrow { font-size: .85rem; color: var(--teal); font-weight: 600; letter-spacing: .04em; }
.t-head h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin: 4px 0 10px; }
.goal { color: var(--muted); }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.jump button, .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 14px; font-size: .9rem; }
.jump button:hover, .chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

ul.list, ol.how { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
ol.how li::marker { color: var(--teal); font-weight: 700; }
.note { border-radius: 10px; padding: 12px 16px; border: 1px solid; }
.note b { display: block; font-size: .85rem; letter-spacing: .04em; }
.note.tip { background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 35%, transparent); }
.note.tip b { color: var(--teal); }
.note.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.note.warn b { color: var(--warn); }

/* code */
.code { background: var(--code-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--code-line); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--code-line); font-size: .78rem; color: var(--code-muted); font-family: var(--f-mono); }
.code-bar button { background: transparent; border: 1px solid var(--code-line); color: var(--code-ink); border-radius: 6px; padding: 1px 10px; font-size: .78rem; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.code pre code, .tr-code { font-family: var(--f-mono); font-size: .86rem; line-height: 1.65; color: var(--code-ink); background: none; border: 0; padding: 0; }
.out { border-top: 1px dashed var(--code-line); padding: 10px 16px; font-family: var(--f-mono); font-size: .84rem; color: var(--hl-str); white-space: pre-wrap; }
.out::before { content: 'Output ▸'; display: block; color: var(--code-muted); font-size: .72rem; margin-bottom: 2px; }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-kw); }
.hljs-string, .hljs-subst { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-comment { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--hl-fn); }
.hljs-type, .hljs-title.class_ { color: var(--hl-type); }
.hljs-meta { color: var(--hl-num); }

table.t { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.t th, table.t td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { background: var(--surface2); font-size: .85rem; color: var(--muted); }
table.t tr:last-child td { border-bottom: 0; }

/* visuals */
.vis { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }
.vis .cap { font-size: .82rem; color: var(--muted); margin-bottom: 10px; }
.boxes { display: flex; flex-wrap: wrap; gap: 14px; }
.vbox { display: grid; justify-items: center; gap: 4px; }
.vbox .lid { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.vbox .body { min-width: 92px; padding: 14px 12px 10px; border: 2px solid var(--accent); border-top-width: 8px; border-radius: 6px 6px 10px 10px; text-align: center; font-family: var(--f-mono); font-weight: 600; background: var(--accent-soft); }
.vbox .nm { font-weight: 700; }
.arr { display: flex; gap: 0; width: max-content; }
.cell { display: grid; justify-items: center; }
.cell .v { min-width: 52px; padding: 10px 8px; border: 2px solid var(--teal); margin-left: -2px; text-align: center; font-family: var(--f-mono); font-weight: 600; background: var(--teal-soft); }
.cell:first-child .v { border-radius: 8px 0 0 8px; margin-left: 0; }
.cell:last-child .v { border-radius: 0 8px 8px 0; }
.cell .i { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); padding-top: 4px; }
.chain { display: grid; gap: 8px; }
.chain .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chain .cond { font-family: var(--f-mono); font-size: .88rem; padding: 6px 12px; border: 2px solid var(--accent); border-radius: 999px; background: var(--accent-soft); }
.chain .yes { color: var(--ok); font-weight: 600; font-size: .85rem; }
.chain .res { font-family: var(--f-mono); padding: 4px 12px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.chain .no { color: var(--bad); font-size: .8rem; padding-left: 26px; }
.mapv { display: grid; gap: 6px; width: max-content; }
.mapv .pair { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: .9rem; }
.mapv .k { padding: 4px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent); }
.mapv .vv { padding: 4px 12px; border-radius: 8px; background: var(--teal-soft); border: 1px solid var(--teal); }
.anat { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--f-mono); font-size: .95rem; align-items: flex-start; }
.anat span { display: grid; justify-items: center; gap: 4px; }
.anat i { font-style: normal; padding: 4px 8px; border-radius: 6px; }
.anat small { font-family: var(--f-body); font-size: .75rem; color: var(--muted); text-align: center; max-width: 130px; line-height: 1.3; }
.a1 i { background: var(--accent-soft); } .a2 i { background: var(--warn-soft); } .a3 i { background: var(--teal-soft); } .a4 i { background: var(--ok-soft); }
.objs { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.blue { border: 2px dashed var(--accent); border-radius: 10px; padding: 10px 14px; font-family: var(--f-mono); font-size: .85rem; }
.blue b { display: block; font-family: var(--f-display); font-size: 1.05rem; color: var(--accent); }
.obj { border: 2px solid var(--teal); border-radius: 10px; padding: 10px 14px; font-family: var(--f-mono); font-size: .85rem; background: var(--teal-soft); }
.obj b { display: block; font-family: var(--f-display); font-size: 1rem; color: var(--teal); }
.arrow { color: var(--muted); font-size: 1.4rem; }
.tree { display: grid; justify-items: center; gap: 10px; }
.tree .kids { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.tree .nd { font-family: var(--f-mono); padding: 6px 14px; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent-soft); font-weight: 600; }
.tree .kids .nd { border-color: var(--teal); background: var(--teal-soft); }

/* widgets */
.widget { background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.w-title { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; display: flex; gap: 8px; align-items: center; }
.w-title::before { content: 'খেলো'; font-family: var(--f-body); font-size: .7rem; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 8px; }
.w-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.w-row label { display: flex; gap: 6px; align-items: center; font-family: var(--f-mono); }
.widget input, .widget select { font: inherit; font-family: var(--f-mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface2); color: var(--ink); width: 7em; }
.widget select { width: auto; font-family: var(--f-body); }
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 4px 12px; font-size: .92rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mono { font-family: var(--f-mono); }
.log { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 10px 14px; font-family: var(--f-mono); font-size: .82rem; max-height: 180px; overflow: auto; white-space: pre-wrap; margin: 0; }
.log .err { color: var(--bad); }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding: 6px; }
.bars div { flex: 1; background: var(--teal); border-radius: 6px 6px 0 0; display: grid; align-content: start; justify-items: center; color: var(--accent-ink); font-family: var(--f-mono); font-size: .8rem; font-weight: 700; padding-top: 4px; transition: height .25s; min-width: 0; }
.bars div.cmp { background: var(--warn); }
.bars div.sw { background: var(--bad); }
.bars div.done { background: var(--ok); }
.machine { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--f-mono); }
.machine .box { border: 3px solid var(--accent); border-radius: 12px; padding: 12px 18px; background: var(--accent-soft); font-weight: 600; text-align: center; }
.machine .box small { display: block; font-family: var(--f-body); font-size: .72rem; color: var(--muted); }
.machine .io { padding: 8px 14px; border-radius: 10px; background: var(--teal-soft); border: 2px solid var(--teal); min-width: 60px; text-align: center; font-weight: 700; }
.term { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 10px 14px; font-family: var(--f-mono); font-size: .85rem; line-height: 1.55; cursor: text; }
.term-out { max-height: 280px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.term .ps { color: var(--hl-str); }
.term .dir { color: var(--hl-kw); font-weight: 600; }
.term .err { color: var(--hl-num); }
.term .dim { color: var(--code-muted); }
.term-in { display: flex; align-items: baseline; }
.widget .term-in input { flex: 1; min-width: 0; width: auto; background: transparent; border: 0; border-radius: 0; color: inherit; font: inherit; padding: 0 0 0 .5em; outline: none; caret-color: var(--hl-fn); }
.term-mis ol { margin: 4px 0 0; padding-left: 1.4em; }
.term-mis li.ok { color: var(--ok); text-decoration: line-through; }
.pulse { animation: pulse .5s; }
@keyframes pulse { 50% { transform: scale(1.12); } }

/* tracer */
.trace { border: 2px solid var(--teal); border-radius: 14px; background: var(--surface); padding: 14px; display: grid; gap: 12px; }
.tr-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.tr-top .label { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.tr-count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tr-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }
.tr-code { background: var(--code-bg); border-radius: 10px; padding: 10px 0; margin: 0; overflow-x: auto; }
.tr-line { display: block; padding: 0 12px 0 0; white-space: pre; border-left: 4px solid transparent; }
.tr-line .ln { display: inline-block; width: 2.4em; text-align: right; padding-right: 10px; color: var(--code-muted); user-select: none; }
.tr-line.cur { background: var(--code-hl); border-left-color: var(--hl-fn); }
.tr-side { display: grid; gap: 10px; align-content: start; }
.tr-box { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface2); }
.tr-box .label { font-size: .75rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.tr-vars { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; min-height: 30px; }
.tr-vars span { font-family: var(--f-mono); font-size: .85rem; border: 1px solid var(--line); background: var(--surface); padding: 1px 8px; border-radius: 6px; }
.tr-vars span.ch { border-color: var(--warn); background: var(--warn-soft); font-weight: 600; }
.tr-out { margin: 0; font-family: var(--f-mono); font-size: .85rem; min-height: 1.6em; white-space: pre-wrap; color: var(--ok); }
.tr-note { margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--teal-soft); min-height: 3.2em; }
.tr-ctrl { display: flex; flex-wrap: wrap; gap: 8px; }

/* quiz */
.quiz { display: grid; gap: 14px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.q .opts { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.q .opts button { text-align: left; border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 6px 12px; font-family: var(--f-mono); font-size: .88rem; white-space: pre-wrap; }
.q .opts button.right { background: var(--ok-soft); border-color: var(--ok); }
.q .opts button.wrong { background: var(--bad-soft); border-color: var(--bad); }
.q .why { font-size: .93rem; padding: 8px 12px; border-radius: 8px; background: var(--surface2); }

/* problems */
.pfilter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pfilter .sum { margin-left: auto; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.probs { display: grid; gap: 12px; }
.prob { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.prob.isdone { border-color: var(--ok); }
.prob .ph { display: flex; gap: 10px; align-items: flex-start; }
.prob .num { font-family: var(--f-display); font-weight: 800; color: var(--muted); min-width: 1.8em; font-size: 1.1rem; line-height: 1.6; }
.prob .qt { flex: 1; min-width: 0; }
.lvl { font-size: .72rem; font-weight: 700; padding: 1px 9px; border-radius: 99px; white-space: nowrap; margin-top: 4px; }
.lvl.e { background: var(--ok-soft); color: var(--ok); }
.lvl.m { background: var(--warn-soft); color: var(--warn); }
.lvl.h { background: var(--bad-soft); color: var(--bad); }
.lvl.p { background: var(--accent-soft); color: var(--accent); }
.pact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pact label { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: .92rem; cursor: pointer; }
.pact input { width: 18px; height: 18px; accent-color: var(--ok); }
.hint { background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; font-size: .95rem; }
.gate { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface2); border-radius: 8px; padding: 8px 12px; font-size: .93rem; }

.btn.think { border-color: var(--teal); color: var(--teal); font-weight: 600; }
.ladder { background: var(--teal-soft); border-radius: 10px; padding: 12px 16px; display: grid; gap: 6px; font-size: .95rem; }
.ladder ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.ladder ul { margin: 4px 0 0; padding-left: 1.1em; display: grid; gap: 4px; }
.ansbox { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: grid; gap: 6px; }

/* home */
.hero { display: grid; gap: 14px; padding-top: 10px; }

.weeks { display: grid; gap: 0; border-left: 3px solid var(--line); margin-left: 10px; }
.wkrow { position: relative; padding: 0 0 22px 26px; display: grid; gap: 6px; }

.wkrow.started::before { border-color: var(--teal); }

.wkrow h3 { font-size: 1.15rem; margin: 0; }
.wkrow h3 span { color: var(--teal); font-size: .85rem; font-family: var(--f-body); margin-right: 6px; }
.wkrow .tps { display: flex; flex-wrap: wrap; gap: 6px; }
.wkrow .tps a { font-size: .88rem; text-decoration: none; border: 1px solid var(--line); background: var(--surface); padding: 2px 10px; border-radius: 99px; color: var(--ink); }

.steps5 { display: grid; gap: 10px; counter-reset: s; }
.steps5 > div { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.steps5 > div::before { counter-increment: s; content: counter(s, bengali); font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; color: var(--teal); line-height: 1.2; text-align: center; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.rules div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.rules b { display: block; font-family: var(--f-display); font-size: 1.05rem; }

/* flashcards */
.fc-wrap { display: grid; gap: 14px; justify-items: center; }
.fc { width: 100%; max-width: 560px; min-height: 230px; perspective: 1200px; cursor: pointer; border: 0; background: none; padding: 0; }
.fc-in { position: relative; width: 100%; min-height: 230px; transition: transform .5s; transform-style: preserve-3d; }
